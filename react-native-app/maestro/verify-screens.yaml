# Verification flow for React Native RSS Reader
# Ensures visual and functional parity with SwiftUI app
# Preferred: run against a standalone dev build (NOT Expo Go) for reliability.
# iOS bundle id is defined in app.json -> expo.ios.bundleIdentifier
appId: com.rssreader.reactnative
---
# Launch the app with a clean state so screenshots are deterministic
- launchApp:
    clearState: true

# Wait for app to load - look for Setup screen title
- extendedWaitUntil:
    visible: "Select source"
    timeout: 30000

# Step 1: Verify Setup Screen
- assertVisible: "Select source"
- assertVisible: "Coding Journal"
- assertVisible: "Hacker News"
- takeScreenshot: screenshots/01-setup-default

# Step 2: Select a source by tapping on the row
- tapOn:
    id: "source-row-coding-journal"
- takeScreenshot: screenshots/02-setup-selected

# Step 3: Navigate to Feed
- tapOn:
    id: "next-button"
- extendedWaitUntil:
    visible: "Coding Journal"
    timeout: 10000
- takeScreenshot: screenshots/03-feed-screen

# Step 4: Navigate to About (tap info button by testID)
- tapOn:
    id: "info-button"
- extendedWaitUntil:
    visible: "About"
    timeout: 5000
- assertVisible: "RSS Reader"
- takeScreenshot: screenshots/04-about-screen

# Step 5: Navigate to Libraries
- tapOn:
    id: "about-item-libraries"
- extendedWaitUntil:
    visible: "react-native-rss-parser"
    timeout: 5000
- takeScreenshot: screenshots/05-libraries-screen

# Step 6: Go back to About
- back
- assertVisible: "About"

# Step 7: Go back to Feed
- back
- assertVisible: "Coding Journal"

# Step 8: Test navigation - tap gear should go BACK to Setup (not push new screen)
- tapOn:
    id: "settings-button"
- extendedWaitUntil:
    visible: "Select source"
    timeout: 5000
- takeScreenshot: screenshots/06-back-to-setup
